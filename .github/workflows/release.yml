name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Create release package
        run: |
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
          VERSION=$(echo $VERSION | sed -e 's/^v//')
          PACKAGE_NAME="command-plasma-$VERSION.plasmoid"
          echo "Creating package $PACKAGE_NAME..."
          sed -i "s/\"Version\": \".*\"/\"Version\": \"$VERSION\"/" metadata.json
          zip -r "$PACKAGE_NAME" * -x ".git*" -x "install.sh" -x "uninstall.sh" -x README.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./command-plasma-${{ github.ref_name }}.plasmoid
          asset_name: command-plasma-${{ github.ref_name }}.plasmoid
          asset_content_type: application/zip 